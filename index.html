<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Baixinho</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" aria-label="Jogo Flappy Baixinho">
        <div class="hud">
          <span>Flappy Baixinho</span>
          <strong id="score">0</strong>
          <small id="best">Recorde: 0</small>
        </div>

        <button id="game" class="game" aria-label="Tocar para o Luís voar">
          <div class="sun"></div>
          <div class="cloud c1"></div>
          <div class="cloud c2"></div>
          <div id="pipes"></div>

          <div id="luis" class="luis" aria-label="Luís a voar">
            <div class="hair"></div>
            <div class="face">
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="beard"></span>
              <span class="smile"></span>
            </div>
            <div class="shirt"><span>Luís</span></div>
            <div class="lanyard"></div>
            <div class="wings">✨</div>
          </div>

          <div class="floor">TAP TAP TAP</div>

          <div id="overlay" class="overlay">
            <h1>GET READY!</h1>
            <p>TAP / SPACE</p>
            <kbd>↑</kbd>
            <span>faz o Luís voar</span>
          </div>
        </button>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
